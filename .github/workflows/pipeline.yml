name: scrape-verse-pipeline

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST daily
  workflow_dispatch:
    inputs:
      heal:
        description: "Allow self-healing on failure"
        type: boolean
        default: true

concurrency:
  group: scrape-verse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project
        run: pip install -e .

      - name: Run self-healing pipeline
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEAL_ON_FAILURE: ${{ inputs.heal && 'true' || 'true' }}
        run: python -m scrapeverse --json > data/run-report.json

      - name: Commit snapshots
        run: |
          git config user.name "scrape-verse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: nightly snapshot $(date -u +%F)"
          git push
